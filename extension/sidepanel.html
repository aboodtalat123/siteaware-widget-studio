<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiteAware Studio</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #dde3eb;
        --text: #151922;
        --muted: #667085;
        --soft: #eef2f7;
        --accent: #2563eb;
        --radius: 8px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 "Segoe UI", "Noto Sans Arabic", system-ui, sans-serif;
      }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      .app {
        display: grid;
        gap: 10px;
        padding: 10px;
      }
      .topbar, .section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .topbar {
        display: grid;
        gap: 10px;
        padding: 12px;
        position: sticky;
        top: 0;
        z-index: 4;
      }
      .brand-row, .status-row, .field-row, .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .brand strong {
        display: block;
        font-size: 16px;
      }
      .brand span, .site-url, small, .hint {
        color: var(--muted);
        font-size: 11px;
      }
      .icon-button {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--soft);
        color: var(--text);
      }
      .status-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }
      .status-card {
        min-width: 0;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fafbfc;
      }
      .status-card span, .status-card b {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status-card b {
        margin-top: 2px;
        font-size: 12px;
      }
      .section {
        padding: 12px;
      }
      .section-head {
        margin-bottom: 10px;
      }
      .section-head strong {
        font-size: 14px;
      }
      .choices {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }
      .choice {
        min-height: 52px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
        color: var(--text);
        display: grid;
        place-items: center;
        gap: 3px;
        padding: 7px;
      }
      .choice.active {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
        background: #f2f7ff;
      }
      .glyph {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #fff;
        font-weight: 800;
      }
      .control-grid {
        display: grid;
        gap: 10px;
      }
      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 11px;
      }
      input[type="color"] {
        width: 100%;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 4px;
        background: #fff;
      }
      input[type="range"] { width: 100%; }
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 9px;
        background: #fff;
        color: var(--text);
      }
      .switch-row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      .switch-row:last-child { border-bottom: 0; }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .primary, .secondary, .danger {
        min-height: 40px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
      }
      .primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }
      .danger { color: #b42318; }
      .profile-box {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fafbfc;
        padding: 10px;
      }
      .profile-box p {
        margin: 0;
        color: var(--muted);
      }
      .profile-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .profile-grid span, .profile-grid b {
        display: block;
      }
      .profile-grid b {
        color: var(--text);
        word-break: break-word;
      }
      .profile-grid i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        margin-inline-end: 5px;
      }
      .toast {
        min-height: 18px;
        color: var(--accent);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="topbar">
        <div class="brand-row">
          <div class="brand">
            <strong>SiteAware Studio</strong>
            <span id="siteName">...</span>
            <span class="site-url" id="siteUrl"></span>
          </div>
          <button class="icon-button" id="languageToggle" type="button">EN</button>
        </div>
        <div class="status-row">
          <div class="status-card"><span>Preview</span><b id="injectStatus">No</b></div>
          <div class="status-card"><span>Site</span><b id="permissionStatus">Ready</b></div>
          <div class="status-card"><span>AI</span><b id="backendStatus">Rule match</b></div>
        </div>
        <div class="status-row">
          <div class="status-card"><span>Scope</span><b id="scopeLabel">Site</b></div>
          <div class="status-card"><span>Dir</span><b id="directionStatus">RTL</b></div>
          <div class="status-card"><span>Theme</span><b id="themeStatus">Light</b></div>
        </div>
        <div id="toast" class="toast"></div>
      </section>

      <section class="section">
        <div class="section-head"><strong>Preview</strong><span class="hint">Live on page</span></div>
        <div class="switch-row"><span>Open chat</span><input id="openToggle" type="checkbox" /></div>
        <div class="switch-row"><span>RTL</span><input id="dirToggle" type="checkbox" /></div>
      </section>

      <section class="section">
        <div class="section-head"><strong>Icons</strong><span class="hint">Toolbar mark</span></div>
        <div id="iconChoices" class="choices"></div>
      </section>

      <section class="section">
        <div class="section-head"><strong>Launcher</strong><span class="hint">Right-side trigger</span></div>
        <div id="launcherChoices" class="choices"></div>
      </section>

      <section class="section">
        <div class="section-head"><strong>Chat Template</strong><span class="hint">Live shell</span></div>
        <div id="shellChoices" class="choices"></div>
      </section>

      <section class="section">
        <div class="section-head"><strong>Messages</strong><span class="hint">Reply style</span></div>
        <div id="assistantMessageChoices" class="choices"></div>
      </section>

      <section class="section">
        <div class="section-head"><strong>Input</strong><span class="hint">Composer and send</span></div>
        <div id="inputChoices" class="choices"></div>
        <div style="height:8px"></div>
        <div id="sendChoices" class="choices"></div>
      </section>

      <section class="section">
        <div class="section-head"><strong>Colors And Layout</strong><span class="hint">Instant sync</span></div>
        <div class="control-grid">
          <label>Primary<input id="primaryColor" type="color" /></label>
          <label>Surface<input id="surfaceColor" type="color" /></label>
          <label>Width<input id="widthRange" type="range" min="320" max="520" step="4" /></label>
          <label>Height<input id="heightRange" type="range" min="440" max="760" step="4" /></label>
          <label>Radius
            <select id="radiusSelect">
              <option value="sm">Small</option>
              <option value="md">Medium</option>
              <option value="lg">Large</option>
              <option value="xl">Extra Large</option>
            </select>
          </label>
          <label>Launcher position
            <select id="positionSelect">
              <option value="bottom-right">Bottom right</option>
              <option value="bottom-left">Bottom left</option>
              <option value="right-edge">Right edge</option>
              <option value="left-edge">Left edge</option>
            </select>
          </label>
        </div>
      </section>

      <section class="section">
        <div class="section-head"><strong>Site Style</strong><span class="hint">Safe metadata only</span></div>
        <div id="profileBox" class="profile-box"></div>
        <div style="height:10px"></div>
        <div class="actions">
          <button id="detectBtn" class="secondary" type="button">Detect Style</button>
          <button id="applyDetectedBtn" class="secondary" type="button">Apply Palette</button>
          <button id="matchBtn" class="primary" type="button">Match This Site</button>
          <button id="resetBtn" class="secondary" type="button">Reset</button>
          <button id="removeBtn" class="danger" type="button">Remove Widget</button>
        </div>
      </section>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
